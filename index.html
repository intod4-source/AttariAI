<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b7a53"><title>AttariAI</title><style>:root{--g:#0b7a53;--gold:#d6a22d;--ink:#18211d;--muted:#6c7772;--line:#e5e8e6;--bg:#fafbfa}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:var(--ink);min-height:100vh}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}.brand{font-weight:850;font-size:20px}.brand span{color:var(--gold)}.top button{border:0;background:transparent;padding:8px 10px;border-radius:9px;cursor:pointer;color:#4f5b55;font-weight:650}.top button:hover{background:#f2f4f3}.wrap{max-width:780px;margin:auto;padding:0 18px 150px}.empty{text-align:center;padding-top:22vh}.wordmark{font-size:54px;font-weight:900;letter-spacing:-3px;color:var(--g);margin:0}.wordmark span{color:var(--gold)}.sub{color:var(--muted);font-size:15px;margin:12px 0 24px}.suggest{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:#59645f;cursor:pointer}.messages{padding-top:28px;display:grid;gap:22px}.msg{display:grid;grid-template-columns:32px 1fr;gap:11px;align-items:start}.msg.user{grid-template-columns:1fr;justify-items:end}.avatar{width:30px;height:30px;border-radius:9px;background:#e8f5ef;color:var(--g);display:grid;place-items:center;font-weight:900;font-size:13px}.bubble{max-width:690px;line-height:1.75;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#eef1ef;border-radius:18px;padding:10px 14px;max-width:82%}.answer .bubble{padding-top:3px}.sources{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.sources summary{cursor:pointer;font-size:12px;color:#65716b}.sources a{display:block;color:var(--g);font-size:12px;text-decoration:none;padding:6px 0}.composerWrap{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:28px 16px 18px}.composer{max-width:760px;margin:auto;background:#fff;border:1px solid #dfe4e1;border-radius:25px;padding:8px 9px 8px 17px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 5px 24px #18211d12}.composer textarea{border:0;outline:0;resize:none;flex:1;min-height:28px;max-height:130px;padding:8px 0;font:inherit;line-height:1.45;background:transparent}.send{width:38px;height:38px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}.send:disabled{opacity:.45}.mini{text-align:center;color:#969e9a;font-size:10px;margin-top:7px}.ov{position:fixed;inset:0;background:#0005;display:none;place-items:center;padding:16px;z-index:30}.ov.show{display:grid}.modal{width:min(440px,100%);background:#fff;border-radius:18px;padding:20px}.modal h3{margin:0 0 16px}.f{display:grid;gap:5px;margin:12px 0}.f label{font-size:12px;font-weight:700}.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.f textarea{min-height:110px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}@media(max-width:600px){.wordmark{font-size:44px}.empty{padding-top:16vh}.wrap{padding-left:14px;padding-right:14px}.top{padding:0 10px}}</style></head><body><header class="top"><div class="brand">Attari<span>AI</span></div><div><button id="settings">Settings</button><button id="profile">Sign up</button></div></header><main class="wrap"><section id="empty" class="empty"><h1 class="wordmark">Attari<span>AI</span></h1><p class="sub">Ask from trusted Dawat-e-Islami books.</p><div class="suggest"><button class="chip">والدین کے احترام پر حدیث بتائیں</button><button class="chip">Virtues of Salat upon the Prophet ﷺ</button><button class="chip">نماز کی اہمیت کیا ہے؟</button></div></section><section id="messages" class="messages"></section></main><div class="composerWrap"><div class="composer"><textarea id="q" rows="1" placeholder="Message AttariAI"></textarea><button id="send" class="send">↑</button></div><div class="mini">Dawat-e-Islami library sources</div></div><div id="settingsOv" class="ov"><div class="modal"><h3>Settings</h3><div class="f"><label>Trusted note for future answers</label><textarea id="note"></textarea></div><div class="actions"><button class="btn" data-close="settingsOv">Cancel</button><button class="btn primary" id="saveSettings">Save</button></div></div></div><div id="profileOv" class="ov"><div class="modal"><h3>Your profile</h3><div class="f"><label>Name</label><input id="name"></div><div class="f"><label>Address me as</label><select id="gender"><option value="male">Brother</option><option value="female">Sister</option></select></div><div class="actions"><button class="btn" data-close="profileOv">Cancel</button><button class="btn primary" id="saveProfile">Save</button></div></div></div><script type="module">
const $=s=>document.querySelector(s),q=$('#q'),send=$('#send'),messages=$('#messages'),empty=$('#empty');
const state={profile:JSON.parse(localStorage.getItem('attari_profile')||'null'),note:localStorage.getItem('attari_note')||''};
let generator=null,loadingModel=false;
const ur=s=>/[\u0600-\u06ff]/.test(s);
const norm=s=>String(s||'').normalize('NFKC').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,'').replace(/ـ/g,'').replace(/[أإآٱ]/g,'ا').replace(/\s+/g,' ').trim().toLowerCase();
function greet(u){return u?(state.profile?.gender==='female'?'پیاری اسلامی بہن!':'پیارے اسلامی بھائی!'):(state.profile?.gender==='female'?'Dear Sister,':'Dear Brother,')}
function add(role,text){empty.style.display='none';const row=document.createElement('div');row.className='msg '+(role==='user'?'user':'answer');if(role!=='user'){const a=document.createElement('div');a.className='avatar';a.textContent='A';row.appendChild(a)}const b=document.createElement('div');b.className='bubble';const t=document.createTextNode(text);b.appendChild(t);b._answerNode=t;row.appendChild(b);messages.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'end'});return b}
function sourceLabel(s){if(s.sourceGroup==='shamela')return 'Maktaba Shamela';if(String(s.sourceGroup||'').startsWith('dawat-web'))return 'Official Dawat-e-Islami';return 'Dawat-e-Islami Library'}
function sources(box,src){const d=document.createElement('details');d.className='sources';const sm=document.createElement('summary');sm.textContent=`Sources (${src.length})`;d.appendChild(sm);src.forEach((s,i)=>{const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener';a.textContent=`[${i+1}] ${s.title}${s.page?' — page '+s.page:''} · ${sourceLabel(s)}`;d.appendChild(a)});box.appendChild(d)}
function cleanExtract(s=''){return s.replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim()}
function directExtract(r,question){const text=cleanExtract(r?.snippet||r?.text||r?.description||'');if(!text)return'';const n=norm(question);if(/حدیث|احادیث|hadith|hadees/.test(n)){const cues=['ارشاد فرمایا','فرمایا','فرمانِ','فرمان ','مروی ہے','روایت ہے','حدیثِ پاک','حدیث پاک'];let p=-1;for(const c of cues){const x=text.indexOf(c);if(x>=0&&(p<0||x<p))p=x}if(p>=0){let start=Math.max(0,p-170),end=text.indexOf('۔',p+35);if(end<0||end-p<60)end=text.indexOf('۔',p+150);if(end<0)end=Math.min(text.length,p+650);return text.slice(start,Math.min(text.length,end+1)).trim()}}const ans=text.match(/جواب\s*[.…:：-]*\s*([\s\S]{80,900}?)(?=\s+سوال\s|$)/);if(ans)return ans[1].trim();return text.slice(0,850).trim()}
function immediateAnswer(question,src){const u=ur(question),top=src[0],ex=directExtract(top,question),ref=`[1] ${top.title}${top.page?'، صفحہ '+top.page:''}`;if(u)return `${greet(true)}\n\n${ex}\n\nماخذ: ${ref}\n\nدعاؤں کے ساتھ، آپ کا AttariAI بھائی`;return `${greet(false)}\n\n${ex}\n\nSource: ${ref}\n\nWith prayers, your AttariAI brother.`}
async function model(){if(generator)return generator;if(loadingModel)return null;loadingModel=true;try{const m=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2/+esm');m.env.allowLocalModels=false;generator=await m.pipeline('text-generation','onnx-community/Qwen2.5-0.5B-Instruct',{dtype:'q4',device:('gpu'in navigator)?'webgpu':'wasm'});return generator}catch{return null}finally{loadingModel=false}}
async function improve(box,question,src){const g=await model();if(!g)return;const u=ur(question),ctx=src.slice(0,6).map((s,i)=>`[${i+1}] SOURCE=${sourceLabel(s)}\nTITLE=${s.title}\nPAGE=${s.page||''}\nPASSAGE=${(s.snippet||s.text||'').slice(0,1700)}`).join('\n\n');const sys=`You are AttariAI, a careful Islamic research assistant. Answer ONLY from the supplied passages. The Dawat-e-Islami Library and official Dawat-e-Islami websites are PRIMARY. Maktaba Shamela is SUPPLEMENTARY classical material only and must never override a Dawat-e-Islami source. Reply in ${u?'natural, clear Urdu':'very simple English'}. First answer the user's exact question directly in 1-3 sentences; do not give a general essay. If the user asks for a hadith, state the hadith or meaning actually present in the passage and its printed reference only when that reference is visibly present. If the user asks for a ruling, state the ruling first. If the user asks for a dua, give the dua first. Then add only useful context. Cite every sourced claim as [1], [2]. Never invent a quotation, hadith number, book, page, Arabic wording, ruling, or citation. If the passages do not establish the answer, explicitly say the evidence is insufficient. Begin exactly: ${greet(u)} End exactly: ${u?'دعاؤں کے ساتھ، آپ کا AttariAI بھائی':'With prayers, your AttariAI brother.'}`;try{const out=await g([{role:'system',content:sys},{role:'user',content:`USER QUESTION: ${question}\n\nRETRIEVED PASSAGES (already ranked most relevant first):\n${ctx}${state.note?`\n\nOwner saved note (context only; NOT a citation): ${state.note.slice(0,1600)}`:''}`}],{max_new_tokens:340,do_sample:false});const v=out?.[0]?.generated_text,ans=Array.isArray(v)?v[v.length-1]?.content:String(v||'');if(ans&&ans.length>45)box._answerNode.textContent=ans}catch{}}
async function ask(){const question=q.value.trim();if(!question||send.disabled)return;send.disabled=true;q.value='';q.style.height='auto';add('user',question);const box=add('assistant','Searching…');try{const r=await fetch('/api/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({q:question})}),d=await r.json();if(!r.ok)throw new Error(d.error||'search');const src=d.results||[],u=ur(question);if(!src.length){box._answerNode.textContent=u?`${greet(true)}\n\nمجھے دعوتِ اسلامی کی آفیشل ویب سائٹس یا منتخب کتب میں اس سوال کے لیے کافی واضح مواد نہیں ملا۔ سوال کے الفاظ بدل کر دوبارہ کوشش فرمائیں۔\n\nدعاؤں کے ساتھ، آپ کا AttariAI بھائی`:`${greet(false)}\n\nI could not find sufficiently clear material in the official Dawat-e-Islami sources. Please try different wording.\n\nWith prayers, your AttariAI brother.`;return}box._answerNode.textContent=immediateAnswer(question,src);sources(box,src);improve(box,question,src)}catch(e){box._answerNode.textContent=ur(question)?`${greet(true)}\n\nاس وقت تلاش مکمل نہیں ہو سکی، براہِ کرم دوبارہ کوشش فرمائیں۔\n\nدعاؤں کے ساتھ، آپ کا AttariAI بھائی`:`${greet(false)}\n\nSearch could not be completed just now. Please try again.\n\nWith prayers, your AttariAI brother.`}finally{send.disabled=false}}
send.onclick=ask;q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,130)+'px'});document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{q.value=c.textContent;q.focus()});function open(id){$('#'+id).classList.add('show')}function close(id){$('#'+id).classList.remove('show')}$('#settings').onclick=()=>{$('#note').value=state.note;open('settingsOv')};$('#profile').onclick=()=>{$('#name').value=state.profile?.name||'';$('#gender').value=state.profile?.gender||'male';open('profileOv')};document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>close(x.dataset.close));document.querySelectorAll('.ov').forEach(x=>x.onclick=e=>{if(e.target===x)close(x.id)});$('#saveSettings').onclick=()=>{state.note=$('#note').value.trim().slice(0,8000);localStorage.setItem('attari_note',state.note);close('settingsOv')};$('#saveProfile').onclick=()=>{state.profile={name:$('#name').value.trim(),gender:$('#gender').value};localStorage.setItem('attari_profile',JSON.stringify(state.profile));$('#profile').textContent=state.profile.name||'Profile';close('profileOv')};if(state.profile?.name)$('#profile').textContent=state.profile.name;
</script></body></html>
